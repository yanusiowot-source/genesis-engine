<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09061a" />
    <meta
      name="description"
      content="Нажми ссылку — откроется небо. Tap to open the sky."
    />
    <meta property="og:title" content="Небо" />
    <meta
      property="og:description"
      content="Нажми ссылку. Диск галактики откроется в телефоне."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yanusiowot-source.github.io/genesis-lab/" />
    <meta property="og:image" content="https://yanusiowot-source.github.io/genesis-lab/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://yanusiowot-source.github.io/genesis-lab/og.jpg" />
    <title>Genesis Engine</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=optional"
    />
  </head>
  <body style="margin:0;background:#09061a;color:#f4efe6">
    <div id="boot" role="status">
      <p class="boot-line" id="boot-line">The sky is still gathering</p>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        var ru = /(?:^|[?&])ru(?:[=&]|$)/.test(location.search) || /(?:^|[?&])lang=ru(?:&|$)/.test(location.search);
        var line = document.getElementById("boot-line");
        if (ru && line) line.textContent = "Небо ещё собирается";
        if (ru) document.documentElement.dataset.show = "1";
        setTimeout(function () {
          if (document.documentElement.dataset.boot === "done") return;
          if (!line) return;
          line.textContent = ru
            ? "Если пусто — открой ссылку в Chrome"
            : "If this stays empty, open the link in Chrome";
        }, 12000);
      })();
    </script>
    <script>
      (() => {
        var h =
          "https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=optional";
        var l = document.createElement("link");
        l.rel = "stylesheet";
        l.href = h;
        l.media = "print";
        l.onload = function () {
          this.media = "all";
        };
        document.head.appendChild(l);
      })();
    </script>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
