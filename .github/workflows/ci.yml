name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 06:00 CEST. GitHub cron is UTC.
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Prepare CI logs
        run: mkdir -p ci-logs
      - id: install
        run: |
          set -o pipefail
          npm ci 2>&1 | tee ci-logs/install.log
      - id: typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee ci-logs/typecheck.log
      - id: manifest
        run: |
          set -o pipefail
          node scripts/check-test-manifest.mjs 2>&1 | tee ci-logs/manifest.log
      - id: test
        run: |
          set -o pipefail
          npm test 2>&1 | tee ci-logs/test.log
      # scripts/*.test.mjs are named here. The checker fails when a file is on
      # disk and in neither this line nor the hold list in check-test-manifest.mjs.
      - id: scripts
        run: |
          set -o pipefail
          node --test scripts/alert.test.mjs scripts/brand-check.test.mjs scripts/browser-smoke-verdict.test.mjs scripts/check-auth-invariant.test.mjs scripts/check-test-manifest.test.mjs scripts/ci-log.test.mjs scripts/cycle-gate.test.mjs scripts/migration-plan.test.mjs scripts/monitor.test.mjs scripts/preview.test.mjs scripts/repo-hygiene.test.mjs scripts/sign-out-plan.test.mjs scripts/with-app-env.test.mjs scripts/write-atomic.test.mjs 2>&1 | tee ci-logs/scripts.log
      - name: Index CI logs
        if: always()
        run: |
          node scripts/ci-log.mjs ci-logs/steps.jsonl install "${{ steps.install.outcome }}" ci-logs/install.log
          node scripts/ci-log.mjs ci-logs/steps.jsonl typecheck "${{ steps.typecheck.outcome }}" ci-logs/typecheck.log
          node scripts/ci-log.mjs ci-logs/steps.jsonl manifest "${{ steps.manifest.outcome }}" ci-logs/manifest.log
          node scripts/ci-log.mjs ci-logs/steps.jsonl test "${{ steps.test.outcome }}" ci-logs/test.log
          node scripts/ci-log.mjs ci-logs/steps.jsonl scripts "${{ steps.scripts.outcome }}" ci-logs/scripts.log
      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs
          path: ci-logs/
          retention-days: 14
          if-no-files-found: warn
