name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 06:00 CEST. GitHub cron is UTC.
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Full `test:scripts` includes Grok scaffold OG tests that need .grok
      # (not in this repo) and grok.me identity. Lab CI is physics + the lock.
      - run: node --test scripts/cycle-gate.test.mjs
